openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lessons
    description: AI Teacher lesson planning
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /lesson-plan:
    post:
      operationId: generateLessonPlan
      tags: [lessons]
      summary: Generate a personalized lesson plan
      description: Generates a lesson plan from a student's setup choices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonPlanInput"
      responses:
        "200":
          description: Generated lesson plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonPlanResponse"
        "400":
          description: Invalid setup choices
        "500":
          description: Lesson plan generation failed
  /teaching-message:
    post:
      operationId: generateTeachingMessage
      tags: [lessons]
      summary: Answer a student's lesson question
      description: Answers a student's question using the selected lesson context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeachingMessageInput"
      responses:
        "200":
          description: Teaching response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeachingMessageResponse"
        "400":
          description: Invalid teaching message
        "500":
          description: Teaching response failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LessonPlanInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 1
        level:
          type: string
          enum: [Beginner, Intermediate, Advanced]
        language:
          type: string
          enum: [English, Hindi, Marathi, Hinglish]
        availableTime:
          type: string
          enum: ["5 minutes", "20 minutes", "60 minutes"]
        learningGoal:
          type: string
          minLength: 1
      required: [topic, level, language, availableTime, learningGoal]
    LessonPlanSection:
      type: object
      properties:
        title:
          type: string
        minutes:
          type: number
          minimum: 1
        description:
          type: string
      required: [title, minutes, description]
    LessonPlan:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        objectives:
          type: array
          items:
            type: string
        concepts:
          type: array
          items:
            type: string
        teachingOrder:
          type: array
          items:
            $ref: "#/components/schemas/LessonPlanSection"
        examples:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            type: string
        assessmentPlan:
          type: string
      required:
        - title
        - summary
        - objectives
        - concepts
        - teachingOrder
        - examples
        - questions
        - assessmentPlan
    LessonPlanResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [gemini, demo]
        plan:
          $ref: "#/components/schemas/LessonPlan"
      required: [mode, plan]
    TeachingMessageInput:
      type: object
      properties:
        setup:
          $ref: "#/components/schemas/LessonPlanInput"
        lesson:
          $ref: "#/components/schemas/LessonPlanResponse"
        messages:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/TeachingMessage"
        question:
          type: string
          minLength: 1
          maxLength: 2000
      required: [setup, lesson, messages, question]
    TeachingMessage:
      type: object
      properties:
        role:
          type: string
          enum: [teacher, student]
        text:
          type: string
          minLength: 1
          maxLength: 2000
      required: [role, text]
    TeachingMessageResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [gemini, demo]
        message:
          type: string
      required: [mode, message]

